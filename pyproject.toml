[project]
name = "afterhours"
version = "0.1.0"
description = "UK political transparency platform – aggregating Parliament, Companies House, and Local Council data to detect conflicts of interest."
requires-python = ">=3.11"

[project.scripts]
afterhours = "manage:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
